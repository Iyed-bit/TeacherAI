    async function sendRequest(selector = '.main-input', prompt = null) {
      const input = selector ? document.querySelector(selector) : null;
      const output = document.querySelector('.main-output');
      const content = prompt || (input instanceof HTMLInputElement || input instanceof HTMLTextAreaElement
        ? input.value.trim()
        : input?.dataset.prompt || input?.innerText.trim());

      if (!content) {
        output.innerText = 'Enter a question first.';
        return;
      }

      output.innerText = 'Loading...';
      try {
        const response = await fetch('http://localhost:3000/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content }),
        });
        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || `Request failed (HTTP ${response.status}).`);
        }

        output.innerText = result.output || 'The AI returned an empty response.';
        if (input instanceof HTMLInputElement || input instanceof HTMLTextAreaElement) {
          input.value = '';
        }
      } catch (error) {
        console.error('TeacherAI request failed:', error);
        output.innerText = error instanceof TypeError
          ? 'Could not reach the TeacherAI server. Make sure the backend is running at http://localhost:3000.'
          : error.message;
      }
    }

    document.querySelectorAll('[data-prompt]').forEach((button) => {
      button.addEventListener('click', () => sendRequest(null, button.dataset.prompt));
    });

    document.querySelector('.main-input').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        sendRequest('.main-input');
      }
    });
