<!DOCTYPE html>
<html>
  <head>
    <title>Lesson Summarizer</title>
    <link rel="stylesheet" href="../../styles/text-summarizer.css">
  </head>
  <body>
    <h1>Summarize your lesson here either by entering a pdf file or just by pasting it in the input area.</h1>
    <input type="file" id="inpFile">
    <textarea type="text" style="width:300px; height: 150px;" id="resultText" class="sum-input" placeholder="Your Pdf"></textarea>

    <button type="button" class="send-button" id="btnUpload">Summarize Lesson</button>
    <div class="sum-output"></div>
    <script src="../../scripts/api-client.js"></script>
    <script src="../../scripts/text-summarizer.js"></script>
  </body>
</html>
